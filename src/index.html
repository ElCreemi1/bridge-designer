<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ASCE Bridge Designer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Allow "Add to Home Screen" on iOS to open without browser bars. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bridge Designer" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
      /* Scope these overrides to startup; the editor still needs its own phone layout. */
      body:has(#startup-loading) { margin: 0; min-width: 0 !important; }
      #startup-loading {
        box-sizing: border-box; width: 100%; min-width: 0;
        height: auto; min-height: 100vh; min-height: 100dvh;
        padding: 16px; gap: 16px; overflow: auto; font-family: sans-serif;
      }
      #startup-loading .splash-img {
        box-sizing: border-box; width: min(600px, 100%); height: auto;
        max-height: 50vh; object-fit: contain;
      }
      #startup-loading .loading-img { width: min(319px, 100%); margin-top: 0; }
      #startup-diagnostics {
        position: fixed; inset: 12px; z-index: 2147483647; overflow: auto;
        box-sizing: border-box; padding: 16px; background: #fff; color: #171717;
        border: 2px solid #ad2600; border-radius: 8px; font: 16px/1.4 sans-serif;
        padding-bottom: max(16px, env(safe-area-inset-bottom));
      }
      #startup-diagnostics pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
      #startup-diagnostics button { min-height: 48px; padding: 10px 18px; font-size: 16px; }
    </style>
    <script>
      // Inline so diagnostics do not depend on another successfully loaded local asset.
      (function () {
        var messages = [];
        var started = Date.now();
        function describe(value) {
          try { return value && value.stack ? String(value.stack) : String(value); }
          catch (_) { return '[unprintable error]'; }
        }
        function render() {
          if (!document.getElementById('startup-loading') || !document.body) return;
          var panel = document.getElementById('startup-diagnostics');
          if (!panel) {
            panel = document.createElement('section');
            panel.id = 'startup-diagnostics';
            panel.setAttribute('role', 'alert');
            var heading = document.createElement('h2');
            heading.textContent = 'Bridge Designer has not finished starting';
            var explanation = document.createElement('p');
            explanation.textContent = 'Diagnostic build: please send a screenshot of the details below. Reload retries startup without clearing saved bridge data.';
            var details = document.createElement('pre');
            details.id = 'startup-details';
            var retry = document.createElement('button');
            retry.type = 'button';
            retry.textContent = 'Reload';
            retry.addEventListener('click', function () { window.location.reload(); });
            panel.appendChild(heading);
            panel.appendChild(explanation);
            panel.appendChild(details);
            panel.appendChild(retry);
            document.body.appendChild(panel);
          }
          var base;
          try { base = new URL(document.baseURI).origin + new URL(document.baseURI).pathname; }
          catch (_) { base = document.baseURI; }
          document.getElementById('startup-details').textContent =
            'Diagnostic version: startup-check-1\n' +
            'Page: ' + window.location.origin + window.location.pathname + '\n' +
            'Base: ' + base + '\n' +
            'Viewport: ' + window.innerWidth + ' x ' + window.innerHeight + '\n\n' +
            (messages.length ? messages.join('\n\n') :
              'No JavaScript or resource error was captured. A pending startup operation or modal dialog may be blocking progress.');
        }
        function record(message) {
          if (messages.length < 12) messages.push(String(message).slice(0, 2500));
          window.setTimeout(render, 0);
        }
        window.addEventListener('error', function (event) {
          var target = event.target;
          if (target && target !== window && (target.src || target.href)) {
            record('Resource failed [' + target.tagName + ']: ' + (target.src || target.href));
          } else {
            record('JavaScript error: ' + describe(event.error || event.message) +
              '\nAt: ' + (event.filename || '') + ':' + (event.lineno || 0));
          }
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          record('Unhandled promise rejection: ' + describe(event.reason));
        });
        var originalError = console.error;
        console.error = function () {
          originalError.apply(console, arguments);
          var parts = [];
          for (var i = 0; i < arguments.length; i++) parts.push(describe(arguments[i]));
          record('Console error: ' + parts.join(' '));
        };
        var timer = window.setInterval(function () {
          if (document.readyState === 'loading') return;
          if (!document.getElementById('startup-loading')) {
            var panel = document.getElementById('startup-diagnostics');
            if (panel) panel.remove();
            console.error = originalError;
            window.clearInterval(timer);
            return;
          }
          if (Date.now() - started >= 15000) render();
        }, 1000);
      })();
    </script>
  </head>
  <body>
    <app-root>
      <div id="startup-loading" class="loading-div">
        <img class="splash-img" alt="Bridge Designer splash"
          title="Lehigh Gap, Pennsylvania, US" src="img/splash.png" />
        <p role="status">Loading Bridge Designer...</p>
        <img class="loading-img" alt="Loading animation" src="img/loading.gif" />
      </div>
    </app-root>
  </body>
</html>
