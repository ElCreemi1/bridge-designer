name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-debug.yml'
      - 'capacitor.config.json'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'src/**'
      - 'public/**'

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using preinstalled Android SDK: $SDK"
          for required in platforms/android-35/android.jar build-tools/35.0.0/aapt2 platform-tools/adb; do
            if [ ! -s "$SDK/$required" ]; then
              echo "::error::Required preinstalled SDK file is missing: $SDK/$required"
              ls -la "$SDK" || true
              exit 1
            fi
          done
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$SDK" "$SDK" >> "$GITHUB_ENV"

      - name: Install locked web dependencies
        run: npm ci

      - name: Install experimental Android packaging dependencies
        run: |
          npm install --save-exact @capacitor/core@7 @capacitor/android@7
          npm install --save-dev --save-exact @capacitor/cli@7

      - name: Compile Angular application with root-relative assets
        run: |
          npx ng build --configuration production --base-href /
          test -s dist/bridge-designer/browser/index.html
          test -s dist/bridge-designer/browser/img/splash.png
          test -s dist/bridge-designer/browser/img/loading.gif

      - name: Generate and synchronize Android project
        run: |
          npx cap add android
          npx cap sync android
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
          test -s android/app/src/main/assets/public/index.html
          test -s android/app/src/main/assets/public/img/splash.png
          test -s android/app/src/main/assets/public/img/loading.gif

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK and resolved dependency records
        run: |
          mkdir -p apk-artifact
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-artifact/bridge-designer-touch-debug.apk
          cp package.json apk-artifact/resolved-package.json
          cp package-lock.json apk-artifact/resolved-package-lock.json
          cp capacitor.config.json apk-artifact/
          cp COPYING apk-artifact/
          cp ANDROID-TOUCH.md apk-artifact/
          printf '%s\n' "$GITHUB_SHA" > apk-artifact/source-commit.txt
          cd apk-artifact
          sha256sum bridge-designer-touch-debug.apk > SHA256SUMS.txt

      - name: Upload experimental APK
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-designer-touch-debug-${{ github.run_number }}
          path: apk-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Record build result
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          {
            echo '## Experimental Android debug APK'
            echo
            echo "Source commit: $GITHUB_SHA"
            echo "Artifact: $ARTIFACT_URL"
            echo
            echo 'Compilation and packaging succeeded. This is not a device-tested release.'
            echo 'Native startup no longer redirects for desktop-only mouse and screen requirements. Actual runtime checks remain enabled.'
            echo 'Phone layout, gesture cancellation, and file handling remain incomplete.'
            echo 'The APK uses a temporary debug signing key; a later build may require uninstalling the previous build. Export bridge files before uninstalling to avoid data loss.'
            echo 'Resolved packaging dependency records are included in the artifact; the repository lockfile was not changed by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
