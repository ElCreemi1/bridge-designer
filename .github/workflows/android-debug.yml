name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-debug.yml'
      - 'capacitor.config.json'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'src/**'
      - 'public/**'
permissions:
  contents: read
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using preinstalled Android SDK: $SDK"
          for required in platforms/android-35/android.jar build-tools/35.0.0/aapt2 platform-tools/adb; do
            if [ ! -s "$SDK/$required" ]; then
              echo "::error::Required preinstalled SDK file is missing: $SDK/$required"
              ls -la "$SDK" || true
              exit 1
            fi
          done
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$SDK" "$SDK" >> "$GITHUB_ENV"
      - name: Install locked web dependencies
        run: npm ci
      - name: Install experimental Android packaging dependencies
        run: |
          npm install --save-exact @capacitor/core@7 @capacitor/android@7
          npm install --save-dev --save-exact @capacitor/cli@7
      - name: Test center-load distribution and numerical response
        run: npx ng test --watch=false --browsers=ChromeHeadless --include='**/center-load.spec.ts'
      - name: Compile Angular application with root-relative assets
        run: |
          npx ng build --configuration production --base-href /
          test -s dist/bridge-designer/browser/index.html
          test -s dist/bridge-designer/browser/img/splash.png
          test -s dist/bridge-designer/browser/img/loading.gif
      - name: Generate and synchronize Android project
        run: |
          npx cap add android
          npx cap sync android
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
          test -s android/app/src/main/assets/public/index.html
          test -s android/app/src/main/assets/public/img/splash.png
          test -s android/app/src/main/assets/public/img/loading.gif
      - name: Restrict phone activity to landscape
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('android/app/src/main/AndroidManifest.xml')
          namespace = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', namespace)
          tree = ET.parse(path)
          activities = [a for a in tree.getroot().findall('./application/activity') if a.get('{' + namespace + '}name', '').endswith('MainActivity')]
          if len(activities) != 1:
              raise SystemExit('Expected exactly one MainActivity')
          activities[0].set('{' + namespace + '}screenOrientation', 'sensorLandscape')
          tree.write(path, encoding='utf-8', xml_declaration=True)
          if not any(a.get('{' + namespace + '}name', '').endswith('MainActivity') and a.get('{' + namespace + '}screenOrientation') == 'sensorLandscape' for a in ET.parse(path).getroot().findall('./application/activity')):
              raise SystemExit('Landscape orientation verification failed')
          PY
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Collect APK and resolved dependency records
        run: |
          mkdir -p apk-artifact
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-artifact/bridge-designer-touch-debug.apk
          cp package.json apk-artifact/resolved-package.json
          cp package-lock.json apk-artifact/resolved-package-lock.json
          cp capacitor.config.json COPYING ANDROID-TOUCH.md CENTER-LOAD.md apk-artifact/
          printf '%s\n' "$GITHUB_SHA" > apk-artifact/source-commit.txt
          cd apk-artifact
          sha256sum bridge-designer-touch-debug.apk > SHA256SUMS.txt
      - name: Upload experimental APK
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-designer-touch-debug-${{ github.run_number }}
          path: apk-artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Record build result
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          {
            echo '## Experimental Android debug APK'
            echo "Source commit: $GITHUB_SHA"
            echo "Artifact: $ARTIFACT_URL"
            echo 'Focused center-load numerical tests, compilation and packaging succeeded. This is not a device-tested release.'
            echo 'Choose Center load (2D static) in the Simulation selector. Loads are kN per modeled truss; original app dead-load factors remain. Not a real-world structural safety rating.'
            echo 'Landscape is requested. Touch interaction and file handling still require device validation.'
            echo 'A temporary debug signing key is used; later builds may require uninstalling. Export bridge files before uninstalling.'
            echo 'Resolved dependency records are included; the repository lockfile was not changed by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
